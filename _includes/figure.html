{%- comment -%} usage: {% include figure.html src="/path.jpg" alt="..." caption="..." %} {%- endcomment -%}
<figure class="figure{% if include.wide %} figure-wide{% endif %}">
  <a href="{{ include.src | relative_url }}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy"></a>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
