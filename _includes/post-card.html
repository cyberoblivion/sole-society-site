<article class="card">
  <a class="card-link" href="{{ include.post.url | relative_url }}">
    {% if include.post.cover %}<img class="card-img" src="{{ include.post.cover | relative_url }}" alt="" loading="lazy">{% endif %}
    <div class="card-body">
      <time class="muted small" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
      <h3>{{ include.post.title }}</h3>
      {% if include.post.excerpt %}<p>{{ include.post.excerpt | strip_html | truncatewords: 24 }}</p>{% endif %}
    </div>
  </a>
</article>
